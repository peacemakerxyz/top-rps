<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <script src="script.js" defer></script>
</head>

<style>
    h1,
    h2,
    h3,
    p {
        text-align: center;
    }

    .buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
    }

    #output {
        display: flex;
        justify-content: center;
    }
</style>

<body>

    <h1>RPS Game</h1>
    <h2>Choices</h2>

    <!--For centering the buttons-->
    <div class="buttons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissor">Scissor</button>
    </div>

    <div>
        <h3>Current Score - Race to 5 points</h3>
        <p id="hs">Human Score: </p>
        <p id="cs">Computer Score: </p>
    </div>

    <p>Result of the round</p>
    <div id="output">

    </div>

    <h1>Game Winner</h1>
    <h1 id="winner"></h1>


</body>

</html>
